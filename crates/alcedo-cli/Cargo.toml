[package]
name = "alcedo-cli"
description = "alcedo 的命令行：解析分享链接，输出 JSON 或人类可读的摘要"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "alcedo"
path = "src/main.rs"
# 库也叫 alcedo，两边都生成 rustdoc 会往同一个目录写，cargo doc 报文件名冲突。
# CLI 的用法在 --help 和 README 里，不需要 rustdoc 产物。
doc = false

[dependencies]
alcedo = { path = "../alcedo" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "fs", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
# download / serve /media 都要自己拉媒体流：连接池、读超时、不跟跳转的
# 客户端在这里，与解析库的连接池分开（大流量长流，策略完全不同）
reqwest = { workspace = true, features = ["rustls-no-provider", "http2", "stream"] }
# /media 的链接签名（HMAC-SHA256，对应 Python 侧 net.sign 的玩法）
hmac = "0.12"
sha2 = "0.10"
# serve 模式。hyper / tower 已经被 reqwest 带进来了，axum 只多几个小 crate；
# 关掉默认 feature，不要 HTTP/2 服务端、表单、multipart 这些用不上的东西。
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }

[lints]
workspace = true
