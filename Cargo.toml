[workspace]
members = ["crates/alcedo", "crates/alcedo-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/yourname/alcedo"
authors = ["alcedo contributors"]

[workspace.dependencies]
tokio = { version = "1", default-features = false }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
thiserror = "2"
tracing = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }

# 解析是 IO 密集 + 短生命周期对象密集; opt-level 3 + thin LTO 对 JSON / 正则路径
# 有实测收益, codegen-units=1 让内联跨模块生效
[profile.release]
opt-level = 3
lto = "thin"
# 不用 panic="abort": 这是要长在服务端的库, 单条解析 panic 不该把整个进程
# 带走。保留 unwind, 上层可以按请求兜住。
codegen-units = 1
strip = "symbols"

# 跑 bench / 压测时用, 保留符号方便 perf
[profile.bench]
inherits = "release"
strip = "none"
debug = 1

# ---------------------------------------------------------------- lint 基线
#
# 写在这里而不是靠 CI 脚本传 -W：本地 `cargo clippy` 和 CI 用的是同一套标准，
# 不会出现"我这儿是绿的"。新增平台时这些规则一样生效。
[workspace.lints.rust]
# 目前全项目零 unsafe，锁死。解析器处理的是不可信输入，内存安全是底线，
# 真要开口子必须是一次显式的、要过评审的改动。
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# 这是个要发到 crates.io 的库，公开 API 没文档等于没法用。
# 一次补齐之后开着，新增的公开项漏写文档 CI 会拦住。
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# 下面这几条都是在这个项目里真抓到过问题的，不是凑数：
# 平台 CDN 偶尔回 .WEBP / .JPG，按字面比会漏
case_sensitive_file_extension_comparisons = "deny"
# 各家的 id / 时长有的是数字有的是字符串，绕 f64 转整数会丢精度
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
# duration == 0.0 这类判断，本意是"没取到"，写成浮点相等很脆
float_cmp = "warn"
# 永远返回 Ok 的函数会让调用方多写一层 ?
unnecessary_wraps = "warn"
# 超过 100 行的函数：目前 0 个，别让它长回来
too_many_lines = "warn"
map_unwrap_or = "warn"
redundant_clone = "warn"

# 明确不要的：纯风格偏好，噪音盖过信号
module_name_repetitions = "allow"   # Source::DouYin 写成 Self::DouYin 反而更难读
missing_errors_doc = "allow"        # 错误类型只有一个, 每个函数抄一遍 # Errors 没有意义
missing_panics_doc = "allow"
must_use_candidate = "allow"
